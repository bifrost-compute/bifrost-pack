# ============================================================================
# bifrost-pack
# ============================================================================
# Bifrost is a Go control plane for Ray and Dask clusters: a REST API on :8484
# with OIDC/JWKS bearer validation and deny-by-default RBAC, a persistent
# desired-state store, a level-triggered reconciler that owns KubeRay
# RayCluster/RayService objects, Kueue-backed resource pools, and a federating
# Ray Jobs gateway.
#
# Every flag rendered by this chart exists on `bifrost serve`
# (cmd/bifrost/serve.go). Flags the Rust predecessor had but Bifrost deliberately did NOT
# port — --policy, --audit-log, --metering-interval-secs, --demo — have no
# values here on purpose. If you are migrating from the predecessor pack, those knobs
# are gone, not renamed.

# Short, predictable object names ("bifrost", "bifrost-ui") regardless of the
# release name, and therefore a short derived Keycloak client id. Clear this
# (fullnameOverride: "") to get standard release-scoped names — required if
# you install more than one Bifrost release into a single namespace.
fullnameOverride: bifrost
nameOverride: ""

image:
  # Published by bifrost's own .github/workflows/publish.yml on every push to
  # main: UBI9-micro runtime, static CGO_ENABLED=0 binary, USER 1001:0,
  # ENTRYPOINT /usr/local/bin/bifrost. That workflow tags `sha-<short>` and
  # `latest`, and smoke-tests the pushed artifact (runs --version, asserts
  # non-root and statically linked) before the job goes green.
  repository: ghcr.io/brandonrc/bifrost

  # REQUIRED — there is deliberately no default, and templating fails with a
  # message if you omit it.
  #
  # It used to default to "" and fall through to .Chart.AppVersion, which
  # release.yaml stamps from the release tag ("0.1.0"). But publish.yml pushes
  # only `sha-<short>` and `latest`, so that default named an image that has
  # never existed: a plain `helm install` succeeded and then sat in
  # ImagePullBackOff, failing far from its cause. A loud refusal beats a
  # plausible wrong answer.
  #
  # PREFER `sha-<short>`. `latest` is mutable, and note what it does with the
  # pullPolicy below: `latest` + IfNotPresent is the worst pairing available —
  # a node caches whatever it first pulled and never re-pulls, so the cluster
  # silently pins itself to an arbitrary old build. `latest` + Always is the
  # other trap: a pod picks up whatever was pushed most recently the next time
  # it happens to restart, which is exactly how a broken dashboard image came
  # back after its fix had landed. A pinned SHA redeploys when you decide to.
  #   --set image.tag=sha-c7b0003
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# >1 requires store.kind=postgres (enforced in _helpers.tpl). memory and
# sqlite are single-writer, per-pod state.
replicaCount: 1

# Address `bifrost serve --bind` listens on. Bifrost fails closed on a
# non-loopback bind with no configured authentication (api.CheckBindAllowed),
# so this only works alongside auth.mode=oidc|local, or an explicit
# auth.mode=none + dangerousDevAllowUnauthenticated.
bind: 0.0.0.0:8484

# --- Desired-state store ----------------------------------------------------
# `bifrost serve --store <kind> [--db <dsn>]`. Unlike the Rust predecessor, the backend is an
# explicit choice, not sniffed from the DSN prefix.
#   memory   - no persistence. Cluster ownership and audit history are lost on
#              pod replacement; the reconciler rebuilds observed state from the
#              cluster but has no desired state to reconcile toward. Dev only.
#   sqlite   - (default) a file on a PVC (--db=/data/bifrost.db). Single
#              writer: replicaCount is pinned to 1 and the roll strategy is
#              Recreate.
#   postgres - external Postgres (--db=<dsn>). Enables replicaCount>1 with a
#              RollingUpdate; no PVC. Schema is created on first connect.
store:
  kind: sqlite
  postgres:
    # DSN passed to `--db` (postgres:// or postgresql://).
    #
    # SECURITY / KNOWN GAP: `bifrost serve` accepts the DSN only as a command
    # line argument — there is no env-var or file indirection in
    # cmd/bifrost/serve.go. The password is therefore visible in the pod spec
    # (`kubectl get pod -o yaml`) to anyone with pod read in this namespace.
    # This is inherited from the Rust predecessor and is a tracked backend change, not
    # something the chart can fix without a shell wrapper. Use a dedicated,
    # rotatable role.
    dsn: ""

persistence:
  # Only consulted when store.kind=sqlite. Disabled falls back to an emptyDir
  # (state lost on pod replacement — same practical posture as store.kind=memory).
  enabled: true
  size: 2Gi
  # "" = the cluster default StorageClass.
  storageClass: ""
  accessMode: ReadWriteOnce

# --- Authentication ---------------------------------------------------------
# auth.mode selects how callers authenticate to the control plane:
#   oidc  - (default) validate bearer JWTs against auth.oidc.*. Rendered to
#           auth.json and passed `--auth-config`. NOTE: JSON, not the predecessor's
#           TOML (cmd/bifrost/authconfig.go).
#   local - IdP-free username/password auth (ADR-0011): `--local-auth`. On
#           first boot an `admin` user is bootstrapped; the password comes
#           from BIFROST_LOCAL_ADMIN_PASSWORD when auth.local.existingSecret
#           is set, otherwise it is generated and written 0600 to
#           /data/local-admin-password (store.kind=sqlite only — with
#           postgres or memory there is no --db file path, so the password is
#           only logged once).
#   none  - NO caller authentication. Refused unless
#           auth.dangerousDevAllowUnauthenticated is explicitly true.
auth:
  mode: oidc

  oidc:
    # OIDC issuer; {issuer}/.well-known/openid-configuration must resolve at
    # boot — Bifrost performs discovery during startup and fails fast if it
    # cannot. REPLACE this placeholder with your Nebari Keycloak realm, e.g.
    # https://nebari.example.com/auth/realms/nebari
    issuer: https://keycloak.example.com/realms/nebari
    # Where to FETCH discovery (and, through it, the JWKS) when that is not
    # the issuer. Keycloak stamps its fixed frontend hostname as `iss` even
    # for callers that reach it through its Service, and on a private
    # cluster that hostname may have no in-cluster DNS and a certificate the
    # pod does not trust. Set this to the in-cluster URL of the realm; keep
    # `issuer` as the value tokens carry. The advertised issuer is still
    # cross-checked against `issuer`. http here needs allowInsecureTransport.
    # "" = discover at the issuer.
    #   discoveryURL: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:8080/realms/nebari
    discoveryURL: ""

    # Required `aud` claim on presented JWTs.
    #
    # Leave empty and it is DERIVED: when nebariApp.api provisions the
    # Keycloak client, the operator names that client
    # `<namespace>-<nebariapp-name>` (nebari-operator naming.ClientID), which
    # this chart computes at template time. That is what keeps first boot
    # deterministic — nothing here reads the operator's
    # `<nebariapp>-oidc-client` Secret, which does not exist until after the
    # operator's first reconcile. With no provisioning NebariApp it falls back
    # to the literal "bifrost", for a hand-registered client.
    #
    # Enabling nebariApp.api therefore CHANGES the expected audience. The
    # effective value is printed by NOTES.txt on every install and upgrade.
    # Set this explicitly when the client is provisioned out of band, or when
    # a Keycloak audience mapper puts a different value in `aud`.
    audience: ""

    # Claim carrying group memberships (Keycloak default: "groups").
    groupsClaim: groups

    # IdP group names -> Bifrost roles. "*" matches any authenticated caller.
    # Deny-by-default: a caller mapping to no role authenticates fine and is
    # authorized for nothing.
    roles:
      admin: []      # e.g. ["/platform-admins"]
      operator: []   # e.g. ["/sre"]
      developer: []  # e.g. ["/ml-eng"]
      viewer: []     # e.g. ["*"]
      auditor: []    # audit-trail readers (compliance)

    # group -> project-role automation (self-service). A caller in a matching
    # group automatically holds the mapped role scoped to project:<group>
    # (after stripPrefix), with no manual `PUT /api/v1/access/assignments`.
    # "*" => every group the caller is in derives its own project role.
    # Omitted/empty keeps it off (deny-by-default).
    projectRoles: {}
    #   operator: ["*"]
    #   developer: []
    #   stripPrefix: "/"   # Keycloak "/team-a" groups -> project:team-a

  local:
    # With auth.mode=oidc, ALSO enable local username/password auth
    # (`--local-auth`) beside OIDC: bfr_ PATs, the bifrost-jupyter dev
    # fallback and an IdP-independent admin login need it. The binary takes
    # both flags together; the chart used to force a choice. Ignored when
    # auth.mode=local (always on) or none.
    enabled: false
    # Optional Secret providing the bootstrap admin password; its
    # `passwordKey` becomes BIFROST_LOCAL_ADMIN_PASSWORD.
    existingSecret: ""
    passwordKey: BIFROST_LOCAL_ADMIN_PASSWORD

  # Must be true for auth.mode=none to render at all.
  dangerousDevAllowUnauthenticated: false

# `--allow-insecure-transport`: permit auth tokens over cleartext http://
# southbound. Default true because in-cluster Ray head services
# (http://<id>-head-svc.<ns>.svc:8265 — the exact URL Bifrost's live client
# builds) are plain HTTP and the tokens ride only the pod network. Set false
# if every registered api_base_url is https.
allowInsecureTransport: true

# --- Administrator controls and metering -------------------------------------
# Requirement 7 (which images and how many workers a cluster may ask for) and
# requirement 14 (usage samples), passed to `bifrost serve`. The frozen API has
# no operation to edit these: they are deployment configuration by design.
admission:
  # Image prefixes a cluster may request, e.g. ["rayproject/", "registry.example.com/ml/"].
  # Empty = any image.
  allowedImages: []
  # Cap on the sum of max_replicas across a cluster's worker groups. 0 = no cap.
  maxWorkers: 0
metering:
  # How often a usage sample is recorded per running cluster (Go duration).
  interval: 1m

# --- Group model serving ----------------------------------------------------
# Requirements 1 and 2: a group (project) deploys one Ray Serve application
# and its members reach it through the gateway. `--services-per-project` is
# the cap on live services per project; the default of 1 is the design (a
# second deploy under a different name is refused with 409 until the first is
# deleted — redeploying the SAME name is an update). Raise it only as an
# escape hatch for a project that genuinely runs several applications; the
# flag is omitted from the pod spec while it is 1, so the binary's default
# governs.
services:
  perProject: 1

# --- Cluster lifecycle (KubeRay + Kueue) ------------------------------------
ray:
  # Enables `serve --namespace=<ns>`: the reconciler, the pool reconciler, and
  # the Ray Serve service routes. Without it Bifrost runs API-and-gateway only.
  enabled: true

  # Namespace Bifrost provisions RayClusters/RayServices into. "" = the release
  # namespace.
  #
  # DO NOT point this at `ray`. On a Nebari cluster that namespace belongs to
  # rayserve-pack's `shared` release. Bifrost's reconciler is already scoped by
  # ownership label (it lists only `app.kubernetes.io/managed-by=bifrost`
  # objects — internal/provision/live/client.go List/ServiceClient.List), so it
  # will not reconcile or reap rayserve-pack's RayService. But it also applies
  # namespace-level NetworkPolicy posture and Pod Security Standards labels to
  # this namespace, which is not something to do to somebody else's. Templating
  # fails on `ray` unless ray.allowRayNamespace=true.
  namespace: ""
  allowRayNamespace: false

  # `--ray-autoscaling`: new clusters default to KubeRay in-tree-autoscaler
  # ownership of worker replicas (ADR-0007). Per-cluster Kueue-elastic pools
  # get it regardless.
  autoscaling: false

  # `--reconcile-interval` (Go duration). "" uses Bifrost's own default.
  reconcileInterval: ""

  # Placement every tenant Ray pod carries — heads, workers, Serve pods and
  # RayJob submitters alike (`--ray-node-selector` / `--ray-tolerations`).
  # Deployment-wide, not per cluster: it says where THIS control plane may
  # put tenant pods on THIS cluster. The typical Nebari case is a dedicated
  # user node group that JupyterHub taints `hub.jupyter.org/dedicated=user`
  # (NoSchedule) — without the toleration below no tenant cluster can
  # schedule there and everything lands on the core nodes.
  #
  #   nodeSelector:
  #     hub.jupyter.org/node-purpose: user
  #   tolerations:
  #     - key: hub.jupyter.org/dedicated
  #       operator: Equal
  #       value: user
  #       effect: NoSchedule
  #
  # Changing these re-applies every managed pod template and KubeRay rolls
  # the pods; the owned-spec fingerprint ignores them, so nothing drifts.
  nodeSelector: {}
  tolerations: []

# --- kuberay-operator subchart ----------------------------------------------
# OFF BY DEFAULT, and that default is load-bearing:
#
#   * Exactly one KubeRay operator may own a cluster's ray.io CRDs. Nebari
#     clusters already run one — Grace runs kuberay-operator 1.4.0
#     cluster-wide, and rayserve-pack vendors 1.3.0 as its own subchart.
#   * Helm installs CRDs on first install ONLY and never upgrades them. The
#     first chart to install wins; every later one silently runs against
#     whatever CRD schema is already there. A 1.3.0-vendored install against
#     1.4.0 CRDs (or the reverse) is a skew nothing reports.
#   * Bifrost's own e2e runs against 1.4.0 (bifrost/.github/workflows/
#     kind-e2e.yml), which is why this pin is 1.4.0 and not 1.3.0.
#
# Turn it on ONLY for a standalone install on a cluster with no KubeRay
# operator at all — and then verify with `kubectl get crd rayclusters.ray.io
# -o jsonpath='{.metadata.annotations}'` which release owns the CRDs.
kuberay-operator:
  enabled: false

serviceAccount:
  create: true
  # "" = the chart fullname.
  name: ""
  annotations: {}

rbac:
  # Namespaced Role/RoleBinding in ray.namespace + the cluster-scoped
  # ClusterRole/ClusterRoleBinding. Only rendered when ray.enabled.
  create: true
  # Kueue objects (Cohort/ResourceFlavor/ClusterQueue/LocalQueue) are
  # cluster-scoped or listed across all namespaces, so they need their own
  # cluster-wide rules. Harmless when the Kueue CRDs are absent — Bifrost
  # probes for them (live.Client.KueuePresent) and degrades to in-process
  # quota. Set false if your cluster policy forbids granting verbs on an API
  # group that is not installed.
  #
  # KUEUE VERSION MATTERS: Bifrost targets kueue.x-k8s.io/**v1beta2** and
  # probes for exactly that GroupVersion. Against a Kueue old enough to serve
  # only v1beta1 the probe fails and the pool reconciler never starts —
  # silently, with one INFO line ("Kueue CRDs absent — pools are in-process
  # quota only"). Verified on kind: Kueue v0.14.2 fails the probe, v0.19.2
  # passes it. These RBAC rules are version-independent (RBAC names groups
  # and resources, not versions), so this toggle is not the thing to change
  # if pools are not starting — upgrade Kueue.
  kueue: true

service:
  type: ClusterIP
  port: 8484
  annotations: {}

# --- Static cluster registry (federating job gateway) -----------------------
# Pre-registered Ray clusters for the Jobs gateway (e.g. a shared cluster
# deployed by rayserve-pack). Rendered to clusters.json and passed
# `--registry`; when empty the flag is omitted entirely.
#
# Tokens: prefer authTokenEnv (the NAME of an env var read at startup) with
# registryTokenSecret supplying that variable — the token then never touches a
# ConfigMap. authToken (plaintext) is dev-only; Bifrost logs a warning for it.
clusters: []
# - id: shared
#   hostname: ray.nebari.example.com
#   apiBaseUrl: http://shared-nebari-rayserve-pack-head-svc.ray.svc:8265
#   authTokenEnv: SHARED_RAY_TOKEN

# Name of a Secret whose keys become environment variables on the bifrost
# container (envFrom). Point clusters[].authTokenEnv at those keys.
registryTokenSecret: ""

# --- Dynamic gateway registration (ephemeral jobs and Serve) ----------------
# Requirement 5 (ephemeral RayJob) and the Serve half of requirements 1/2:
# clusters Bifrost provisions itself — a RayJob's cluster while it runs, a
# RayCluster, a RayService's serve endpoint — are added to the gateway
# registry as they come up and removed as they go, alongside the static
# `clusters` above. Each is addressed by Host header as `<name>.<domain>`.
#
# domain: the DNS suffix the gateway matches on. Empty (the default) keeps
# dynamic registration OFF — only the static registry is routable, exactly as
# before. Routing the wildcard `*.<domain>` to the control plane Service is
# an ingress/NebariApp concern outside this chart for now; on a cluster
# without wildcard DNS the entries are still reachable with an explicit
# `Host:` header against the Service.
#
# externalBase: the scheme-and-authority prefix Bifrost puts in front of that
# hostname when it reports `gateway_url` to callers, e.g. "https://". It only
# labels responses — nothing is routed by it — and it is meaningless without
# a domain, so setting it alone fails at template time.
gateway:
  domain: ""
  externalBase: ""

# Dask (requirement 16) is deferred, and so is its `dask.enabled` toggle. The
# flag (`--dask`) and the `kubernetes.dask.org` daskclusters RBAC rule are
# added here in the same change that adds them to `bifrost serve`, never
# ahead of it — this chart does not render flags the binary cannot parse.

# --- Network policy ---------------------------------------------------------
# Ingress policy for the control plane itself. This is NOT the tenant policy
# set — Bifrost applies its own default-deny / tenant-allow / per-cluster
# policies to the Ray pods it provisions (internal/provision/kuberay.go), and
# those are not templated here.
networkPolicy:
  enabled: false
  # Namespaces allowed to reach :8484 (the Envoy Gateway's namespace, plus
  # anything else that calls the API directly).
  allowedNamespaces:
    - envoy-gateway-system
  extraIngress: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# ============================================================================
# Dashboard (bifrost-ui)
# ============================================================================
# nginx-served SPA. The image's baked nginx.conf reverse-proxies /api/,
# /healthz and /docs to a hardcoded `http://bifrost:8484` (its docker-compose
# service name), so this chart mounts its own rendered default.conf over it,
# pointing at this release's control-plane Service.
#
# SSO: the SPA reads its OIDC client id and issuer at runtime from
# /config.json (ui.sso.*, derived from the UI NebariApp's SPA client and
# auth.oidc.issuer). The token the SPA obtains must carry an `aud` Bifrost
# accepts (auth.oidc.audience): the nebari-operator currently provisions the
# SPA client WITHOUT an audience or groups mapper, so until that lands the
# two mappers are added to the client by hand (Grace, 2026-09-02). The
# local-auth login form works alongside (auth.local.enabled).
ui:
  # OFF by default — and that default is a testing hazard worth stating,
  # because it hid a real bug.
  #
  # Anything exercised only with default values never starts this container.
  # The chart's kind proving run (full lifecycle, three NetworkPolicies, PSS
  # labels, 43 RBAC allows / 15 denies) passed without the dashboard ever
  # running once, so a crash-on-startup incompatibility between the image and
  # this chart's own securityContext survived to a real cluster: stock nginx
  # runs as root and chowns /var/cache/nginx, which needs CAP_CHOWN, which
  # `capabilities: drop: ["ALL"]` removes. It CrashLoopBackOff'd on grace.
  #
  # Fixed by moving the image to nginx-unprivileged (uid 101, port 8080). The
  # standing lesson: any verification of this chart must run at least once
  # with `ui.enabled=true`, or this whole path is untested.
  enabled: false
  # Served to the SPA as /config.json at runtime (bifrost-ui reads it before
  # first render, so the published image needs no per-deployment build).
  # Empty values are derived: clientId from the SPA client the operator
  # provisions for nebariApp.ui (<namespace>-<nebariapp>-spa, or
  # spaClient.clientID); issuer from auth.oidc.issuer when auth.mode=oidc.
  sso:
    clientId: ""
    issuer: ""
  image:
    repository: ghcr.io/brandonrc/bifrost-ui
    tag: latest
    # `latest` is mutable: IfNotPresent would serve a node's stale cached
    # layer after a re-push to the same tag. Pin a digest and set this back to
    # IfNotPresent.
    pullPolicy: Always
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ============================================================================
# Nebari integration (NebariApp CRs — reconcilers.nebari.dev/v1)
# ============================================================================
# PREREQUISITE: the release namespace must carry `nebari.dev/managed: "true"`
# or the nebari-operator ignores every NebariApp in it, silently.
#   kubectl label namespace <ns> nebari.dev/managed=true --overwrite
nebariApp:
  api:
    enabled: false
    hostname: ""   # e.g. bifrost.nebari.example.com

    auth:
      # provisionClient + enforceAtGateway is the deliberate combination here.
      #
      # Bifrost validates OIDC bearer tokens itself (ADR-0003: caller
      # credentials terminate at the control plane). If the gateway enforced
      # OIDC it would answer `ray job submit`, the `bifrost` CLI, and every
      # curl with an HTML redirect to a Keycloak login page. So the
      # SecurityPolicy stays off — enforceAtGateway: false — while the
      # operator still provisions the Keycloak client, whose id becomes the
      # audience Bifrost requires (see auth.oidc.audience above).
      enabled: true
      provider: keycloak
      provisionClient: true
      enforceAtGateway: false
      # Envoy rejects "/" here; /oauth2/callback is the gateway default. It is
      # inert while enforceAtGateway is false, but the operator still records
      # it on the provisioned client's valid redirect URIs.
      redirectURI: /oauth2/callback
      scopes: [openid, profile, email]
      groups: []
      # Public Keycloak client for the OAuth2 Device Authorization Grant —
      # what `bifrost login` uses. Client id lands in the OIDC Secret under
      # `device-client-id`; it is not read by this chart.
      deviceFlowClient:
        enabled: false
      spaClient:
        enabled: false

    routing:
      # REQUIRED. Without spec.routing the operator creates no HTTPRoute and
      # the hostname 404s with RoutingNotConfigured.
      routes:
        - pathPrefix: /
          pathType: PathPrefix

    gateway: ""      # "" = the public gateway; "internal" = the internal one
    landingPage:
      enabled: false

  # Second NebariApp for the dashboard. Requires ui.enabled — the operator
  # validates that spec.service.name references an existing Service.
  #
  # Gateway auth is OFF here too, and that is a recommendation, not an
  # oversight: the SPA runs its own sign-in and bearers its own API calls, and
  # its /api/* requests are proxied to Bifrost by the pod's own nginx, so a
  # gateway SecurityPolicy would authenticate the page load while doing
  # nothing for the XHRs behind it. `enforceAtGateway: true` +
  # `forwardAccessToken: true` is the coherent alternative — it would put a
  # real bearer token on the upstream request — but only once the two
  # bifrost-ui blockers listed under `ui:` above are fixed and the forwarded
  # token's audience matches what Bifrost validates.
  ui:
    enabled: false
    hostname: ""   # e.g. bifrost-dashboard.nebari.example.com
    auth:
      enabled: false
      provider: keycloak
      provisionClient: false
      enforceAtGateway: false
      redirectURI: /oauth2/callback
      scopes: [openid, profile, email]
      groups: []
      spaClient:
        enabled: false
      deviceFlowClient:
        enabled: false
    routing:
      routes:
        - pathPrefix: /
          pathType: PathPrefix
    gateway: ""
    landingPage:
      enabled: true
      displayName: Bifrost
      description: Control plane for Ray and Dask clusters — SSO, RBAC, quotas, and a federating job gateway
      icon: https://raw.githubusercontent.com/brandonrc/bifrost-pack/main/assets/bifrost-icon.png
      category: Compute
      priority: 20
      healthCheck:
        enabled: true
        path: /healthz
        intervalSeconds: 30
        timeoutSeconds: 5

# -----------------------------------------------------------------------------
# Observability: how a Prometheus stack scrapes Bifrost and the Ray clusters it
# provisions, and the Grafana dashboard that reads the result.
#
# Off by default: it needs the prometheus-operator CRDs (ServiceMonitor,
# PodMonitor) and a Grafana with the dashboards sidecar. Everything here was
# first wired by hand on a live deployment and then written down; the point of
# templating it is that the next deployment gets it by flipping one value.
# -----------------------------------------------------------------------------
observability:
  enabled: false
  # Where the ServiceMonitor/PodMonitors are created and where Prometheus runs.
  # The bearer-token Secret must live in this namespace too (operator rule).
  namespace: observability
  # The label the operator's Prometheus selects monitors by
  # (spec.serviceMonitorSelector / podMonitorSelector).
  prometheusReleaseLabel: kube-prom-stack
  api:
    # GET /api/v1/metrics is Read on the cluster target: the scraper needs an
    # identity. Make a local `viewer` user for it and mint a PAT
    # (POST /api/v1/auth/tokens), then:
    #   kubectl -n <namespace> create secret generic <secretName> --from-literal=token=bfr_...
    secretName: bifrost-metrics-token
    secretKey: token
    interval: 30s
  ray:
    # Every head and worker Bifrost provisions exposes Prometheus metrics on
    # :8080. Bifrost's own tenant policy admits nothing else to those pods, so
    # this also renders a NetworkPolicy in the Ray namespace that opens exactly
    # that port to exactly the scraper's namespace. The bifrost.dev/cluster-id
    # and bifrost.dev/owner pod labels become series labels (bifrost_cluster,
    # bifrost_owner), which is what lets the dashboard slice by tenant.
    interval: 15s
    networkPolicy: true
  gateway:
    # The platform gateway's view of Bifrost: request rate, status classes and
    # latency per HTTPRoute. Envoy exposes thousands of series per pod; only
    # request-level series for the routes matching routeNamespaces are kept.
    enabled: false
    namespace: envoy-gateway-system
    podSelector:
      gateway.envoyproxy.io/owning-gateway-name: nebari-gateway
    metricsPort: metrics
    routeNamespaces: [bifrost, jupyter, checkmaite]
  dashboard:
    # The "Bifrost platform" Grafana dashboard (chart/dashboards/), shipped as
    # a ConfigMap the Grafana dashboards sidecar picks up from any namespace.
    # Source of truth is bifrost/deploy/grafana; scripts/sync-dashboard.sh
    # copies it here.
    enabled: true
    namespace: ""            # default: observability.namespace
    datasourceUid: mimir     # the Prometheus-compatible datasource in Grafana
    label: grafana_dashboard
    labelValue: "1"
