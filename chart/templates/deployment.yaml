{{- include "bifrost-pack.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bifrost-pack.fullname" . }}
  labels:
    {{- include "bifrost-pack.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.store.kind "postgres" }}
  # Postgres store: multiple writers are safe, so run replicaCount pods
  # behind a RollingUpdate.
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
  {{- else }}
  # SQLite is a single writer on an RWO claim and `memory` is per-pod state:
  # a second pod during a roll would either fail to attach the volume or
  # diverge. Single replica, Recreate. (replicaCount>1 is rejected in
  # _helpers.tpl's validate.)
  replicas: 1
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "bifrost-pack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bifrost-pack.labels" . | nindent 8 }}
        # REQUIRED, not decorative. The tenant-allow NetworkPolicy Bifrost
        # itself applies to the Ray pods it provisions admits ingress to the
        # head's dashboard (8265) and Ray client (10001) ports ONLY from pods
        # carrying this exact label — never from a bare namespace selector
        # (internal/provision/kuberay.go, ControlPlanePodLabel /
        # TenantAllowNetworkPolicy). Drop it and the reconciler still works
        # (it talks to the API server) but every dashboard/jobs/nodes proxy
        # call to a Ray head is blackholed by Bifrost's own policy.
        bifrost.dev/control-plane: "true"
      annotations:
        # Roll the pod when the rendered config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "bifrost-pack.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        # Matches the image's `USER 1001:0`. Group 0 rather than a private
        # group is the OpenShift-compatible posture the Dockerfile chose: an
        # arbitrary-UID runtime keeps gid 0, so group-readable files stay
        # readable. fsGroup makes the PVC writable for that uid.
        runAsUser: 1001
        runAsGroup: 0
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bifrost
          {{- /*
            image.tag is REQUIRED, not defaulted. It used to fall through to
            .Chart.AppVersion, which release.yaml stamps from the GitHub
            Release tag (v0.1.0 -> "0.1.0") — but bifrost's publish workflow
            only ever pushes `sha-<short>` and `latest`, so a default install
            resolved to a tag that has never existed and lands in
            ImagePullBackOff. A silent fallback to a non-existent version
            string fails far from its cause; this fails at template time and
            says what to do.
          */}}
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required — bifrost publishes `sha-<short>` (preferred, immutable) and `latest`; .Chart.AppVersion is NOT a published tag. e.g. --set image.tag=sha-c7b0003" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            # Bifrost writes only to /data (SQLite file + the local-auth
            # password file), which is a mounted volume.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - serve
            - --bind={{ .Values.bind }}
            - --store={{ .Values.store.kind }}
            {{- if eq .Values.store.kind "sqlite" }}
            - --db=/data/bifrost.db
            {{- else if eq .Values.store.kind "postgres" }}
            # See values.yaml: the DSN is visible in the pod spec. Tracked
            # backend gap — `serve` has no env/file indirection for --db.
            - --db={{ .Values.store.postgres.dsn }}
            {{- end }}
            {{- if eq .Values.auth.mode "oidc" }}
            - --auth-config=/etc/bifrost/auth/auth.json
            {{- if include "bifrost-pack.localAuthEnabled" . }}
            - --local-auth
            {{- end }}
            {{- else if eq .Values.auth.mode "local" }}
            - --local-auth
            {{- else }}
            # auth.mode=none, explicitly confirmed via
            # auth.dangerousDevAllowUnauthenticated (see validate).
            - --dev-allow-unauthenticated
            {{- end }}
            {{- if .Values.allowInsecureTransport }}
            - --allow-insecure-transport
            {{- end }}
            {{- if .Values.clusters }}
            - --registry=/etc/bifrost/registry/clusters.json
            {{- end }}
            {{- with .Values.gateway.domain }}
            # Dynamic gateway registration: provisioned clusters and Serve
            # endpoints become routable as `<name>.<domain>` while they live.
            # Omitted when empty, which leaves only the static registry.
            - --gateway-domain={{ . }}
            {{- end }}
            {{- with .Values.gateway.externalBase }}
            - --gateway-external-base={{ . }}
            {{- end }}
            {{- with .Values.admission.allowedImages }}
            - --allowed-images={{ join "," . }}
            {{- end }}
            {{- if .Values.admission.maxWorkers }}
            - --max-workers={{ .Values.admission.maxWorkers }}
            {{- end }}
            {{- with .Values.metering.interval }}
            - --metering-interval={{ . }}
            {{- end }}
            {{- if ne (int .Values.services.perProject) 1 }}
            # One service per project is the binary's default; only an
            # explicit deviation is worth putting in the pod spec.
            - --services-per-project={{ .Values.services.perProject }}
            {{- end }}
            {{- if .Values.ray.enabled }}
            - --namespace={{ include "bifrost-pack.rayNamespace" . }}
            {{- if .Values.tenancy.enabled }}
            # Requirement 21: the policy's `namespaces` map places a project's
            # workloads in its own namespace (needs the ClusterRole rbac.yaml
            # renders under tenancy.enabled).
            - --tenant-namespaces
            {{- end }}
            {{- if .Values.ray.autoscaling }}
            - --ray-autoscaling
            {{- end }}
            {{- with .Values.ray.reconcileInterval }}
            - --reconcile-interval={{ . }}
            {{- end }}
            {{- with .Values.ray.nodeSelector }}
            {{- $pairs := list }}
            {{- range $k, $v := . }}{{ $pairs = append $pairs (printf "%s=%s" $k $v) }}{{ end }}
            - --ray-node-selector={{ join "," $pairs }}
            {{- end }}
            {{- with .Values.ray.tolerations }}
            # JSON so the flag survives argv untouched; quoted so YAML never
            # sees the braces as a flow mapping.
            - {{ printf "--ray-tolerations=%s" (toJson .) | quote }}
            {{- end }}
            {{- end }}
          {{- if and (include "bifrost-pack.localAuthEnabled" .) .Values.auth.local.existingSecret }}
          env:
            - name: BIFROST_LOCAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.local.existingSecret }}
                  key: {{ .Values.auth.local.passwordKey | default "BIFROST_LOCAL_ADMIN_PASSWORD" }}
          {{- end }}
          {{- with .Values.registryTokenSecret }}
          # Secret keys become env vars; clusters[].authTokenEnv names them.
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8484
              protocol: TCP
          # /healthz is in Bifrost's unauthenticated allowlist
          # (internal/api/middleware.go isPublic), so probes need no token.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if eq .Values.auth.mode "oidc" }}
            - name: auth
              mountPath: /etc/bifrost/auth
              readOnly: true
            {{- end }}
            {{- if .Values.clusters }}
            - name: registry
              mountPath: /etc/bifrost/registry
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if and (eq .Values.store.kind "sqlite") .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "bifrost-pack.fullname" . }}-data
          {{- else }}
          # No SQLite file to keep: /data is scratch (the local-auth password
          # file, if any). emptyDir keeps it per-pod.
          emptyDir: {}
          {{- end }}
        {{- if eq .Values.auth.mode "oidc" }}
        - name: auth
          configMap:
            name: {{ include "bifrost-pack.fullname" . }}-auth
        {{- end }}
        {{- if .Values.clusters }}
        - name: registry
          configMap:
            name: {{ include "bifrost-pack.fullname" . }}-registry
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if and (eq .Values.store.kind "sqlite") .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bifrost-pack.fullname" . }}-data
  labels:
    {{- include "bifrost-pack.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
