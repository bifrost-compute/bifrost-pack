{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bifrost-pack.serviceAccountName" . }}
  labels:
    {{- include "bifrost-pack.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Bifrost talks to the Kubernetes API whenever ray.enabled (the reconciler,
# the pool reconciler, the observability reads), so the token is mounted.
# With ray.enabled=false it is API-and-gateway only and needs nothing.
automountServiceAccountToken: {{ .Values.ray.enabled }}
{{- end }}
