{{- if .Values.ui.enabled }}
# nginx site config for the dashboard image.
#
# The image bakes an nginx.conf that proxies /api/, /healthz and /docs to a
# hardcoded `http://bifrost:8484` — its docker-compose service name, which
# does not exist in a Helm release whose Service is named anything else. This
# ConfigMap ships the replacement conf, pointed at this release's
# control-plane Service instead. Everything else (SPA fallback, WebSocket
# upgrade for the log-tail bridge, the long read timeout) is copied from the
# image's own conf so behaviour matches.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bifrost-pack.ui.fullname" . }}
  labels:
    {{- include "bifrost-pack.ui.labels" . | nindent 4 }}
data:
  # Shipped as a TEMPLATE, not a finished conf. The nginx image's entrypoint
  # (20-envsubst-on-templates.sh) renders /etc/nginx/templates/*.template
  # into /etc/nginx/conf.d/ at boot, and 15-local-resolvers.envsh exports
  # NGINX_LOCAL_RESOLVERS from the pod's /etc/resolv.conf. That gives nginx
  # the cluster DNS address without the chart hardcoding one.
  #
  # Why: nginx resolves a literal proxy_pass target (a bare "http" URL naming
  # the upstream host) ONCE, at startup, and exits with "host not found in
  # upstream" if DNS is not yet answering. On a node reboot CoreDNS is rarely
  # first; the dashboard crash-looped on Grace for exactly this reason
  # (2026-09-02). A `resolver` plus a variable upstream defers resolution to
  # request time.
  #
  # NGINX_ENVSUBST_FILTER on the Deployment restricts substitution to
  # NGINX_* so nginx's own $host / $http_upgrade etc. survive envsubst.
  config.json: |
    {{ dict "ssoClientId" (include "bifrost-pack.uiSsoClientId" .) "issuer" (include "bifrost-pack.uiSsoIssuer" .) | toJson }}
  default.conf.template: |
    server {
        # Must match the image's own listen and the Deployment's
        # containerPort: the dashboard image is nginx-unprivileged (uid 101),
        # which cannot bind :80 without CAP_NET_BIND_SERVICE — a capability
        # ui.yaml deliberately drops.
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        set $bifrost_upstream http://{{ include "bifrost-pack.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }};

        location /api/ {
            proxy_pass $bifrost_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket upgrade for the log-tail bridge.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
        location = /healthz {
            proxy_pass $bifrost_upstream;
        }
        # Deployment config the SPA reads before first render (OIDC client
        # id / issuer). Rendered from values below, mounted by ui.yaml.
        location = /config.json {
            alias /etc/bifrost-ui/config.json;
            default_type application/json;
            add_header Cache-Control "no-store";
        }
        location /docs {
            proxy_pass $bifrost_upstream;
            proxy_set_header Host $host;
        }

        # SPA client-side routing.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
{{- end }}
