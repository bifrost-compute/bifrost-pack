{{- if .Values.ui.enabled }}
# nginx site config for the dashboard image.
#
# The image bakes an nginx.conf that proxies /api/, /healthz and /docs to a
# hardcoded `http://bifrost:8484` — its docker-compose service name, which
# does not exist in a Helm release whose Service is named anything else. This
# ConfigMap is mounted over /etc/nginx/conf.d/default.conf to point at this
# release's control-plane Service instead. Everything else (SPA fallback,
# WebSocket upgrade for the log-tail bridge, the long read timeout) is copied
# from the image's own conf so behaviour matches.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bifrost-pack.ui.fullname" . }}
  labels:
    {{- include "bifrost-pack.ui.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://{{ include "bifrost-pack.fullname" . }}:{{ .Values.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket upgrade for the log-tail bridge.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
        location = /healthz {
            proxy_pass http://{{ include "bifrost-pack.fullname" . }}:{{ .Values.service.port }};
        }
        location /docs {
            proxy_pass http://{{ include "bifrost-pack.fullname" . }}:{{ .Values.service.port }};
            proxy_set_header Host $host;
        }

        # SPA client-side routing.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
{{- end }}
