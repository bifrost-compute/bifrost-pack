{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  # Referenced by the UI NebariApp's spec.service.name, which the operator
  # validates against existing Services.
  name: {{ include "bifrost-pack.ui.fullname" . }}
  labels:
    {{- include "bifrost-pack.ui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "bifrost-pack.ui.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bifrost-pack.ui.fullname" . }}
  labels:
    {{- include "bifrost-pack.ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "bifrost-pack.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bifrost-pack.ui.labels" . | nindent 8 }}
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/ui-configmap.yaml") . | sha256sum }}
        {{- with .Values.ui.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bifrost-ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              # 8080, because the dashboard image is nginx-unprivileged: it
              # runs as uid 101 and cannot bind a port below 1024 without
              # CAP_NET_BIND_SERVICE, which the securityContext above drops.
              # Stock nginx here would not merely bind the wrong port — its
              # entrypoint chowns /var/cache/nginx and dies with EPERM under
              # `drop: ["ALL"]`.
              #
              # This number is one of four that move together: the image's
              # baked nginx.conf `listen`, this containerPort, the Service's
              # targetPort (named `http`, so it follows automatically), and
              # ui-configmap.yaml's `listen`. Changing a subset gives a silent
              # 502 instead of a crash.
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          env:
            # Restrict envsubst to our variables: nginx's own $host,
            # $http_upgrade, $uri... must not be substituted away.
            - name: NGINX_ENVSUBST_FILTER
              value: "^NGINX_"
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
            # conf.d must be writable for the entrypoint to render into it.
            - name: nginx-confd
              mountPath: /etc/nginx/conf.d
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      volumes:
        - name: nginx-template
          configMap:
            name: {{ include "bifrost-pack.ui.fullname" . }}
        - name: nginx-confd
          emptyDir: {}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
